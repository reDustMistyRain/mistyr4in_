<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | mistyr4in_</title>
    <meta http-equiv="refresh" content="0; url=./">
    <script>
        // GitHub Pages 404 自動導回首頁並保留 hash
        (function () {
            var path = window.location.pathname;
            var repoPrefix = path.startsWith('/mistyr4in_') ? '/mistyr4in_/' : './';
            window.location.replace(repoPrefix + (window.location.hash || ''));
        })();
    </script>
    <style>
        body {
            background-color: #060609;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            padding: 32px;
        }
        .redirect-code {
            font-family: monospace;
            font-size: 2.4rem;
            color: #00F0FF;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }
        .redirect-msg {
            color: #a0a0b0;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        a {
            color: #00F0FF;
            text-decoration: none;
            border-bottom: 1px solid rgba(0, 240, 255, 0.4);
            padding-bottom: 2px;
        }
        a:hover {
            border-bottom-color: #00F0FF;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="redirect-code">404 // NOT FOUND</div>
        <p class="redirect-msg">正在為您跳轉回首頁...</p>
        <p><a href="./">如果未自動跳轉，請點擊此處返回首頁 →</a></p>
    </div>
</body>
</html>
