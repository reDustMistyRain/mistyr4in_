<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | mistyr4in_</title>
    <script>
        // GitHub Pages 404 自動導回首頁
        (function () {
            var path = window.location.pathname;
            var repoPrefix = path.startsWith('/mistyr4in_') ? '/mistyr4in_/' : '/';
            window.location.replace(repoPrefix);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=./">
    </noscript>
</head>
<body style="background-color: #060609; margin: 0; min-height: 100vh;">
</body>
</html>
