<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="75%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="tapGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0b0e14" stroke="#1f293d" stroke-width="2"/>
  <!-- Tap Bar Base -->
  <rect x="25" y="86" width="150" height="28" rx="6" fill="#003544" stroke="#00F0FF" stroke-width="2" filter="url(#tapGlow)"/>
  <!-- Glowing Center Spindle -->
  <rect x="35" y="94" width="130" height="12" rx="3" fill="url(#tapGrad)"/>
  <!-- Reticle markers -->
  <line x1="100" y1="70" x2="100" y2="80" stroke="#00F0FF" stroke-width="2"/>
  <line x1="100" y1="120" x2="100" y2="130" stroke="#00F0FF" stroke-width="2"/>
  <text x="100" y="165" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">TAP NOTE</text>
</svg>
