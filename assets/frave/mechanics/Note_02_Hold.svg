<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <pattern id="hazardStripes" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#FFB800" stroke-width="8" stroke-opacity="0.7"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#3D2900" stroke-width="12" stroke-opacity="0.9"/>
    </pattern>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0b0e14" stroke="#1f293d" stroke-width="2"/>
  <!-- Hold Body Lane -->
  <polygon points="65,30 135,30 155,140 45,140" fill="url(#hazardStripes)" stroke="#FFB800" stroke-width="2" filter="url(#goldGlow)"/>
  <!-- Glowing Neon Borders -->
  <line x1="65" y1="30" x2="45" y2="140" stroke="#FFE600" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)"/>
  <line x1="135" y1="30" x2="155" y2="140" stroke="#FFE600" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)"/>
  <!-- Tap Head at bottom -->
  <rect x="40" y="132" width="120" height="16" rx="4" fill="#FFB800" stroke="#FFFFFF" stroke-width="2"/>
  <text x="100" y="175" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#FFB800" text-anchor="middle" letter-spacing="2">HOLD / STREAM</text>
</svg>
