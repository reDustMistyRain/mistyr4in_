<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="touchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <filter id="touchGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0b0e14" stroke="#1f293d" stroke-width="2"/>
  <!-- Touch Body Oval -->
  <rect x="35" y="88" width="130" height="24" rx="12" fill="url(#touchGrad)" stroke="#718096" stroke-width="2"/>
  <!-- Core Inner Cyan Indicator -->
  <rect x="70" y="96" width="60" height="8" rx="4" fill="#00F0FF" filter="url(#touchGlow)"/>
  <!-- Passive glide wave indicators -->
  <path d="M 45 70 Q 100 50 155 70" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 45 130 Q 100 150 155 130" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="100" y="170" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">TOUCH / GLIDE</text>
</svg>
