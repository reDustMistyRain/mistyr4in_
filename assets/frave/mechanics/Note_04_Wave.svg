<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1.0"/>
    </linearGradient>
    <filter id="waveGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0b0e14" stroke="#1f293d" stroke-width="2"/>
  
  <!-- Screen Border Barrier (Physical Screen Limit) -->
  <line x1="20" y1="120" x2="180" y2="120" stroke="#334155" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="100" y="138" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="1">PHYSICAL SCREEN BOUNDARY</text>

  <!-- Wave Chevron Arrow soaring outside boundary -->
  <path d="M 40 100 L 100 45 L 160 100 L 140 100 L 100 65 L 60 100 Z" fill="url(#waveGrad)" stroke="#FF007A" stroke-width="2" filter="url(#waveGlow)"/>
  
  <!-- Aerial infrared pulse ripples -->
  <path d="M 60 40 L 100 15 L 140 40" fill="none" stroke="#FF007A" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
  <path d="M 75 30 L 100 10 L 125 30" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>

  <text x="100" y="175" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#FF007A" text-anchor="middle" letter-spacing="2">WAVE / AIR GESTURE</text>
</svg>
