<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="frameSliceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF334B" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#FF334B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="60%" stop-color="#FF334B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF334B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="frameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0b0e14" stroke="#1f293d" stroke-width="2"/>

  <!-- Tunnel wireframe representation -->
  <rect x="35" y="45" width="130" height="85" fill="none" stroke="#253347" stroke-width="1.5"/>
  <rect x="65" y="65" width="70" height="45" fill="none" stroke="#1c2838" stroke-width="1"/>
  <line x1="35" y1="45" x2="65" y2="65" stroke="#1c2838" stroke-width="1"/>
  <line x1="165" y1="45" x2="135" y2="65" stroke="#1c2838" stroke-width="1"/>
  <line x1="35" y1="130" x2="65" y2="110" stroke="#1c2838" stroke-width="1"/>
  <line x1="165" y1="130" x2="135" y2="110" stroke="#1c2838" stroke-width="1"/>

  <!-- Frame Slicing Dynamic Plane -->
  <line x1="15" y1="88" x2="185" y2="88" stroke="#FF334B" stroke-width="4" filter="url(#frameGlow)"/>
  <line x1="25" y1="88" x2="175" y2="88" stroke="#FFFFFF" stroke-width="1.5"/>

  <!-- Directional Chevron Slash Guide -->
  <path d="M 85 80 L 100 88 L 85 96" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 105 80 L 120 88 L 105 96" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 65 80 L 80 88 L 65 96" fill="none" stroke="#FF8595" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="100" y="165" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#FF334B" text-anchor="middle" letter-spacing="2">FRAME / SPATIAL SLASH</text>
</svg>
