<!DOCTYPE html>
<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-footnote/dist/index.umd.min.js"></script>
<script>
  console.log("marked: ", typeof marked);
  console.log("markedFootnote: ", typeof markedFootnote);
  if (typeof marked !== 'undefined' && typeof markedFootnote !== 'undefined') {
      marked.use(markedFootnote());
      console.log("OUTPUT: ", marked.parse('Hello[^1]\n\n[^1]: World'));
  }
</script>
</body>
</html>
